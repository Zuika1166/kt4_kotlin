openapi: 3.0.3
info:
  title: KT4 Books API
  version: 1.0.0
  description: Books API with PostgreSQL, JWT roles and real-time WebSocket notifications
servers:
  - url: http://localhost:8080
tags:
  - name: System
  - name: Authentication
  - name: Books
  - name: Administration
  - name: WebSocket
paths:
  /health:
    get:
      tags:
        - System
      summary: Check application health
      operationId: health
      responses:
        '200':
          description: Application is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a user
      description: New accounts always receive the user role
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login and receive JWT
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /books:
    get:
      tags:
        - Books
      summary: Get all books
      operationId: getBooks
      responses:
        '200':
          description: Book list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
    post:
      tags:
        - Books
      summary: Create a book
      description: Available to authenticated user and admin roles
      operationId: createBook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /books/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Books
      summary: Get a book by id
      operationId: getBook
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Books
      summary: Update a book
      description: Available to authenticated user and admin roles
      operationId: updateBook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Books
      summary: Delete a book
      description: Available only to the admin role
      operationId: deleteBook
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Book deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users:
    get:
      tags:
        - Administration
      summary: Get all users
      description: Available only to the admin role
      operationId: getUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /ws/notifications:
    get:
      tags:
        - WebSocket
      summary: Connect to real-time book notifications
      description: Upgrade the connection to WebSocket and pass JWT in the token query parameter
      operationId: notificationsWebSocket
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '101':
          description: WebSocket connection established
        '400':
          description: WebSocket upgrade failed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    RegisterRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 3
          example: john
        password:
          type: string
          minLength: 6
          format: password
          example: secret123
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          example: john
        password:
          type: string
          format: password
          example: secret123
    UserResponse:
      type: object
      required:
        - id
        - login
        - role
      properties:
        id:
          type: integer
          format: int64
          example: 1
        login:
          type: string
          example: john
        role:
          type: string
          enum:
            - user
            - admin
    TokenResponse:
      type: object
      required:
        - token
        - expiresInSeconds
        - role
      properties:
        token:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
          example: 3600
        role:
          type: string
          enum:
            - user
            - admin
    CreateBookRequest:
      type: object
      required:
        - title
        - author
        - year
      properties:
        title:
          type: string
          example: Clean Code
        author:
          type: string
          example: Robert C. Martin
        year:
          type: integer
          minimum: 1
          maximum: 2100
          example: 2008
    UpdateBookRequest:
      type: object
      required:
        - title
        - author
        - year
      properties:
        title:
          type: string
          example: Clean Code
        author:
          type: string
          example: Robert C. Martin
        year:
          type: integer
          minimum: 1
          maximum: 2100
          example: 2009
    Book:
      type: object
      required:
        - id
        - title
        - author
        - year
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Clean Code
        author:
          type: string
          example: Robert C. Martin
        year:
          type: integer
          example: 2008
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Book not found
